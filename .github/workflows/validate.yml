name: Validate submission
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Selector regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and score under competition runtime limits
        run: make sample
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-selection
          path: output.jsonl
